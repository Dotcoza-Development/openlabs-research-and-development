name: Deploy Governance Sandbox to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/html-webapp-llm-connections-y13tm1
    paths:
      - 'sandbox/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; let the latest push win.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload sandbox/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: sandbox

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
